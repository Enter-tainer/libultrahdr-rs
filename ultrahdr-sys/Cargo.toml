[package]
name = "ultrahdr-sys"
version.workspace = true
edition.workspace = true
license.workspace = true
readme.workspace = true
repository.workspace = true
homepage.workspace = true
keywords.workspace = true
categories.workspace = true
links = "uhdr"
build = "build.rs"
description = "Raw FFI bindings to libultrahdr"
exclude = [
  "/target",
  "/CMakeFiles",
  "/artifacts",
  "/libultrahdr/build",
  "/libultrahdr/CMakeFiles",
]

[features]
default = ["vendored", "iso21496", "xmp"]
# Build libjpeg-turbo and other deps from source via upstream CMake flag.
vendored = []
# Link shared library instead of static.
shared = []
# Enable GLES in upstream build (links EGL/GLES).
gles = []
# Enable HEIF/HEIC & AVIF container support via libheif (needs `vendored` or a
# system libheif with ISO 21496-1 gain-map API).
heif = []
# Enable SMPTE ST 2094-50 dynamic metadata (AGTM) support via libsmpte2094-50.
smpte2094-50 = []
# Enable writing ISO/TS 21496-1 gain map metadata.
iso21496 = []
# Enable writing XMP gain map metadata (GContainer + hdrgm namespace).
# Required for compatibility with Samsung Gallery and other apps that
# only recognize the XMP-based Ultra HDR v1.0 format.
xmp = []
# Disable std::thread usage in upstream build (single-threaded).
no-threads = []
# Raise UHDR_MAX_DIMENSION to libjpeg-turbo's JPEG_MAX_DIMENSION.
jpeg-max-dimension = []
# Cross-compile libaom for wasm32-wasip1 so `heif` has a working AV1 codec on wasm
# (host codecs cannot be linked into a wasm module). No effect on other targets and
# no effect without `heif`. Adds several MB to the wasm binary.
wasm-avif = []

[dependencies]

[build-dependencies]
bindgen.workspace = true
cmake.workspace = true
